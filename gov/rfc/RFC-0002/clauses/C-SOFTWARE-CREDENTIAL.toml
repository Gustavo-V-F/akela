#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-SOFTWARE-CREDENTIAL"
title = "Software and developer credentials required by a UF"
kind = "normative"
status = "active"

[content]
text = """
Where a UF requires the software that issues a document type, or its developer, to be registered, credentialed or certified (for example a credential of the developer, a conformity report from a body the UF authorizes, an authorization linking each issuer to the software, or a code identifying the technical responsible party), Akela MUST hold that requirement in force and MUST meet that UF's software requirements before the document type counts as supported in that UF ([[RFC-0002:C-SUPPORTED-AUTHORIZER]]). Issuance of a document type in a UF where such a requirement is not met MUST be refused as in [[RFC-0002:C-COVERAGE]].

Every document and event MUST identify Akela's developer as the technical responsible party in the field the document's layout defines for it, including the code a UF issued to that developer where the UF requires one."""
