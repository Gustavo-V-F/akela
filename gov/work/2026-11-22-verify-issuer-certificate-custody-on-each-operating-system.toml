[govctl]
id = "WI-2026-11-22-001"
title = "Verify issuer certificate custody on each operating system"
status = "done"
created = "2026-11-22"
started = "2026-11-22"
completed = "2026-11-22"
refs = [
    "RFC-0002",
    "RFC-0002:C-CERTIFICATE-CUSTODY",
    "RFC-0002:C-ISSUANCE-AT-LOCATION",
    "RFC-0001:C-OFFLINE-OPERATION",
    "ADR-0005",
]

[content]
description = """Prove with automated tests that the certificate custody chosen in [[ADR-0005]] works on every supported operating system before any fiscal product code depends on it. In Akela the issuer certificate has two uses, both fiscal: signing documents and events (XML signature with RSA-SHA1) and authenticating the client in the mutual TLS connection to authorizers, the Ambiente Nacional and Sefin Nacional/ADN. Each local store outside the Location Cluster must support both uses from Rust while keeping the private key inside it: the operating system's store, a file store owned by the agent's service account, a PKCS#11 token, and on Windows a smart card reached through the certificate store. Tests need no ICP-Brasil certificate: they use a self-generated RSA certificate in PKCS#12 form like an A1, a software PKCS#11 token (SoftHSM2) and, on Windows, an emulated PIV card (PivApplet on jCardSim behind the vsmartcard virtual reader) seen through the Windows inbox PIV minidriver, standing in for A3 tokens. Linux runs on OneDev, Windows and macOS on GitHub Actions. Also records a "store → exists / how / limits" table. A missing capability reopens [[ADR-0005]], and [[RFC-0002:C-CERTIFICATE-CUSTODY]] if no store is viable on an operating system. Fleet-wide installation, routing issuance to a designated machine and the issuance permission are product behaviour built with the Location Agent and the fiscal core, not part of this item."""

