version: 59
jobs:
- name: push-to-github
  executeInSandbox: false
  steps:
  - type: PushRepository
    name: push to GitHub mirror
    remoteUrl: https://github.com/Gustavo-V-F/akela
    userName: Gustavo-V-F
    passwordSecret: github-mirror-token
    force: false
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    userMatch: anyone
  - type: TagCreateTrigger
  retryCondition: never
  maxAttempts: 3
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 14400
- name: wait-for-github
  executeInSandbox: false
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: wait for the GitHub Actions run
    runInContainer: true
    image: alpine:3.24
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        set -eu
        apk add -q --no-cache github-cli
        ci/wait-github-run.sh @commit_hash@ @ref@
    envVars:
    - name: GH_TOKEN
      value: '@secret:github-mirror-token@'
    runAs: 0:0
    useTTY: false
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    userMatch: anyone
  - type: TagCreateTrigger
  jobDependencies:
  - jobName: push-to-github
    requireSuccessful: true
  retryCondition: never
  maxAttempts: 3
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 14400
- name: rqlite-3node
  executeInSandbox: false
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: kill the Leader of a 3-node cluster
    runInContainer: true
    image: rqlite/rqlite:10.7.4
    interpreter:
      type: PosixInterpreter
      shell: sh
      commands: |
        set -eu
        apk add -q --no-cache curl jq
        timeout 300 ci/rqlite-3node.sh
    runAs: 0:0
    useTTY: false
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    userMatch: anyone
  retryCondition: never
  maxAttempts: 3
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 3600
