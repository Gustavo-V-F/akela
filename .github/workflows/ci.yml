# Runs on every push the OneDev mirror job makes; OneDev reads the result back (roadmap 1.2).
name: CI

on: push

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo run --manifest-path ci/hello/Cargo.toml

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo run --manifest-path ci/hello/Cargo.toml

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add aarch64-linux-android
      - run: |
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          cargo build --manifest-path ci/hello/Cargo.toml --target aarch64-linux-android

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add aarch64-apple-ios
      - run: cargo build --manifest-path ci/hello/Cargo.toml --target aarch64-apple-ios

  # Issuer certificate custody (ADR-0005, WI-2026-11-22-001); Linux runs on OneDev.
  cert-custody-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: ci/cert-custody/windows.sh

  cert-custody-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: ci/cert-custody/macos.sh

  # Java 8 ships on ubuntu-24.04 and windows-2025, not on Ubuntu 26.04, where ubuntu-latest is moving.
  piv-applet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The runner image ships Java 8; using it avoids a JDK download on every run.
      - run: |
          test -n "${JAVA_HOME_8_X64:-}" || { echo "::error::runner image has no Java 8 (JAVA_HOME_8_X64)"; exit 1; }
          echo "JAVA_HOME=$JAVA_HOME_8_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_8_X64/bin" >> "$GITHUB_PATH"
      - run: command -v ant || sudo apt-get install -y -qq ant
      - run: ci/cert-custody/build-piv-applet.sh "$RUNNER_TEMP/piv"
      - uses: actions/upload-artifact@v7
        with:
          name: piv-applet
          path: ${{ runner.temp }}/piv

  cert-custody-windows-smartcard:
    needs: piv-applet
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      # The runner image ships Java 8; using it avoids a JDK download on every run.
      - shell: pwsh
        run: |
          if (-not $env:JAVA_HOME_8_X64) { Write-Host "::error::runner image has no Java 8 (JAVA_HOME_8_X64)"; exit 1 }
          "JAVA_HOME=$env:JAVA_HOME_8_X64" >> $env:GITHUB_ENV
          "$env:JAVA_HOME_8_X64\bin" >> $env:GITHUB_PATH
      - uses: actions/download-artifact@v8
        with:
          name: piv-applet
          path: ${{ runner.temp }}/piv
      - shell: bash
        run: ci/cert-custody/make-fixtures.sh "$(cygpath -u "$RUNNER_TEMP")/fixtures"
      - shell: pwsh
        run: ci/cert-custody/windows-smartcard.ps1 -Fixtures "$env:RUNNER_TEMP\fixtures" -Applet "$env:RUNNER_TEMP\piv"
